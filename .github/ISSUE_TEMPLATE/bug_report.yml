name: Bug report
description: Something in the engine, hooks, MCP server or a scaffold does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command you ran and its output. Remove any secrets or personal data first.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `sbd --version`, or the commit SHA
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options:
        - CLI
        - MCP server
        - Claude Code plugin
        - Git hooks
        - GitHub Action
        - Scaffold template
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Node.js version
