  - id: AI-CTRL-014
    name: Third-Party and Vendor AI Assurance
    family: Governance and Compliance
    tier: Baseline
    description: "Third-Party and Vendor AI Assurance: Assess AI vendors and embedded AI features before use, and reassess when they change."
    implementation: Evaluate vendors against the vendor evaluation framework. Cover training use of customer data, retention, sub-processors, model changes and incident notification in contracts; by default the contract should bar the provider from using personal or confidential data to train or improve its models unless the organization has authorised it. Include audit rights, a right to have the service suspended, and exit and concentration risk where few providers can replace it. Re-evaluate when a vendor changes model or terms. Treat AI built into other products (document readers, content tools, chat widgets on payment pages) as a third-party service when it can reach sensitive data, list the provider with other service providers, and review its due diligence evidence on a set cycle. At contract end, have the provider return or delete the organization's data, fine-tuned models, embeddings and logs, and get written confirmation.
    severity: HIGH
    evidence: Vendor assessments; contract clauses; sub-processor list; model change notices; exit return or deletion confirmation.
    auditTest: Sample AI vendors in use and confirm each has a current assessment and the required contract terms. Confirm the last model or terms change triggered a review.
    owner: Procurement / GRC
    reviewFrequency: Annually and on vendor change
