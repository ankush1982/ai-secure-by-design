  - id: AI-CTRL-045
    name: Human Oversight Design and Effectiveness
    family: Governance and Compliance
    tier: Advanced
    description: "Human Oversight Design and Effectiveness: Design human review so the people named as overseers can understand, challenge, override and stop an AI system, and show with measures that they do."
    implementation: "Set, by risk tier, where a person must review, approve or be able to intervene: before the output is used, while the system runs, and after the fact by sampling. Give each overseer the evidence behind the output (sources, confidence, alternatives) and not only the result, the authority and time to override, and training that matches the role (AI-CTRL-044). Keep the volume per reviewer low enough to be reviewed, and give overseers a way to stop or roll back the system (AI-CTRL-025). Measure effectiveness: override and escalation rates, time per review, results of independent re-review of a sample, and detection of seeded errors. Reassess the design when the measures show rubber-stamping. This control covers oversight of AI-assisted decisions in general; AI-CTRL-023 gates specific irreversible agent actions. Before an agent may act without per-action approval (a person over the loop rather than in it), record and approve: why per-action approval is not workable, the responsible person and why they are suited, which actions run without approval, the minimum privileges, how output is validated, how actions are logged and how often logs are reviewed, how the agent is disabled and on what triggers, and how its actions are reversed. Keep per-action approval for any action involving cleartext payment card data."
    severity: MEDIUM
    evidence: Oversight design record per in-scope use case; overseer roles, authority and training records; sampled re-review results; override and escalation metrics; seeded-error test results.
    auditTest: Select a high-tier use case and compare the oversight points in operation with the design record. Interview two overseers about the evidence they see and their authority to override. Submit a set of known-wrong outputs and measure how many are caught. Confirm the overseers can stop the system and that override metrics are reviewed.
    owner: AI Governance Lead / Application Owner
    reviewFrequency: Semi-annually and on material change
    url: https://nachi065.github.io/AI-Security-Wiki/03_Control_Library/03_AI_Security_Control_Objectives_Library.html#ai-ctrl-045
