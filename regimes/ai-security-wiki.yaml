  - id: AI-CTRL-042
    name: Fundamental Rights and Data Protection Impact Assessment
    family: Governance and Compliance
    tier: Advanced
    description: "Fundamental Rights and Data Protection Impact Assessment: Assess the impact on people's rights before deploying AI that is high-risk or that puts personal data at risk, and keep the assessment current."
    implementation: Run a combined data protection and fundamental rights impact assessment before go-live for in-scope systems. Record purpose, data, groups affected, risks, oversight, mitigation, consultation and decision. Include intended and reasonably foreseeable unintended uses and misuse, the deployment regions and languages, the data and its quality, and benefits as well as harms, as listed in ISO/IEC 42005:2025 clause 6. Record the data protection officer's advice and how it was handled. Reassess on material change and at least annually.
    severity: MEDIUM
    evidence: Completed assessments; data protection officer advice; approvals dated before go-live; review dates; reassessment records.
    auditTest: Sample in-scope systems and confirm the assessment predates go-live. Check that each risk maps to a mitigation. Confirm that the last material change triggered a reassessment.
    owner: Data Protection Officer / AI Governance Lead
    reviewFrequency: Before deployment, annually and on material change
