  - id: AI-CTRL-017
    name: Data Protection in AI Pipelines
    family: Data and Retrieval
    tier: Baseline
    description: "Data Protection in AI Pipelines: Apply classification, minimization and isolation to data that AI systems ingest, process and produce."
    implementation: "Carry data classification into AI pipelines. Minimize or mask sensitive fields before they reach a model. Keep tenants separate in indexes, caches, memory and logs, and record data lineage. Never give a model or agent cleartext high-impact secrets (cryptographic keys, key components, passwords) or ask it to generate them or the random values behind them; route cryptography through a key service or HSM interface that exposes only the keys and functions the task needs. Judge the data an AI system can reach by what it could obtain, not what it is meant to use: tokens or encrypted data plus a reachable detokenisation, decryption or access-management path count as cleartext. Show in the data flow diagrams the data stores AI operation creates (prompt and response logs, transcripts, caches, retrieved context, tool results, agent scratchpads, orchestration state) and mask sensitive values before they are written."
    severity: HIGH
    evidence: Data flow diagrams; classification and masking rules; tenant isolation tests; lineage records.
    auditTest: Send labelled sensitive records through the pipeline and confirm masking at each stage. Attempt to read another tenant's data through the AI interface.
    owner: Data Owner / Security Engineering
    reviewFrequency: Semi-annually
    url: https://nachi065.github.io/AI-Security-Wiki/03_Control_Library/03_AI_Security_Control_Objectives_Library.html#ai-ctrl-017
