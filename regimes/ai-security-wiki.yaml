  - id: AI-CTRL-015
    name: Human and Agent Identity
    family: Identity and Access
    tier: Baseline
    description: "Human and Agent Identity: Give every user, application and agent that uses AI a unique, attributable identity."
    implementation: Issue a unique identity to each agent and AI workload, with a named human sponsor. Do not share keys between workloads. Recertify identities on a schedule and remove them when the sponsor leaves or the use case ends. Authenticate agents to each other and sign the messages they exchange, so that one agent cannot pass as another. Give training jobs, pipelines and model-serving processes their own workload identities. An agent cannot provide a possession or inherence factor, so it cannot perform multi-factor authentication. Where a person would need MFA for the same access, give the agent a device-bound credential, preferably cryptographic (for example a device-specific certificate over mutual TLS), limited in time and never reusable by another system or person, and never use the agent to get around an MFA requirement.
    severity: HIGH
    evidence: Identity registry; sponsor records; recertification results; orphaned identity report.
    auditTest: Sample agent identities and confirm each has a sponsor and a current recertification. Remove a test sponsor and confirm the agent identity is flagged.
    owner: IAM Team
    reviewFrequency: Semi-annually
    url: https://nachi065.github.io/AI-Security-Wiki/03_Control_Library/03_AI_Security_Control_Objectives_Library.html#ai-ctrl-015
    risks:
      - AI-R07
      - AI-R22
