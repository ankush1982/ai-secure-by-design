  - id: AI-CTRL-031
    name: AI Supply Chain and AI-BOM
    family: Supply Chain, Infrastructure and Resilience
    tier: Advanced
    description: "AI Supply Chain and AI-BOM: Know exactly which models, datasets, packages and prompts run in each environment."
    implementation: Maintain an AI bill of materials per system. Take models and packages only from approved sources, verify provenance, and scan them. Re-run security tests when any component changes, including a provider-side model update. Pin model versions rather than using floating aliases such as "latest", and track provider deprecation and change notices so that a model change is a reviewed change. Record in the AI-BOM the model and version, harness and orchestration components, where it is hosted and who runs it, the data and systems it can reach with the restrictions on them, the provider's data use and retention terms, and the intended users and use cases. Authorise, list and monitor for tampering any AI script or widget loaded on a payment page, as for any other page script.
    severity: MEDIUM
    evidence: AI-BOM; approved source list; scan reports; change-triggered test records.
    auditTest: Compare the AI-BOM of a sampled system with what is deployed. Introduce a component from an unapproved source and confirm it is blocked or flagged.
    owner: DevSecOps
    reviewFrequency: Quarterly
