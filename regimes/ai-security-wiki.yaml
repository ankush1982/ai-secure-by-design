  - id: AI-CTRL-041
    name: Fairness, Bias Testing and Explainability
    family: Assurance and Testing
    tier: Advanced
    description: "Fairness, Bias Testing and Explainability: Test AI systems that make or support high-impact decisions for unfair bias, and keep explanations that a person can understand and a reviewer can challenge."
    implementation: Define which decisions are high-impact. Identify the relevant groups with legal input. Test for bias before release, at least annually and on material model change, and record the method, data, thresholds, results and approvals. Where sensitive data is needed for testing, record why it is necessary and the safeguards. Tell customers before an AI-powered service is provided that AI is used and what its main risks and limits are, in plain language. Give an explanation for each high-impact decision and a route to human review. Block or condition release when a threshold fails. Keep a versioned bias profile for each system that records which differences in treatment are intended and which are not, the stakeholder groups considered, how representative the test data is, the risks accepted and who accepted them, and the application boundaries within which the system was validated; monitor for drift outside them.
    severity: MEDIUM
    evidence: Bias test plan and results; customer AI-use notices; threshold approvals; necessity record for sensitive data; explanation records; human-review log; retest evidence; current bias profile with its validated application boundaries.
    auditTest: Sample high-impact use cases and confirm a current bias test exists. Re-perform one test. Trace one decision to its explanation and review outcome. Confirm a failed result led to action.
    owner: AI Governance Lead / Model Risk
    reviewFrequency: Annually and on material model change
    url: https://nachi065.github.io/AI-Security-Wiki/03_Control_Library/03_AI_Security_Control_Objectives_Library.html#ai-ctrl-041
