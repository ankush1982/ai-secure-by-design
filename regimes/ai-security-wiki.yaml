  - id: AI-CTRL-037
    name: AI Risk Assessment and Exception Management
    family: Governance and Compliance
    tier: Advanced
    description: "AI Risk Assessment and Exception Management: Assess, treat and accept AI risks consistently, and keep every exception owned and time-bound."
    implementation: "Keep an AI risk register with an owner and a score for every risk. Use one scoring method so that different assessors reach the same result. Accept residual risk only at the right authority level. Give every exception an owner, a compensating control and an expiry date that the technical control enforces. Allow for attackers who use AI: set remediation and exception time limits for exposed systems on the assumption that a disclosed vulnerability can be exploited within days, and size vulnerability triage for a higher volume of findings (AI-R55)."
    severity: MEDIUM
    evidence: AI risk register; treatment plans; risk acceptance records; exception register with expiry dates.
    auditTest: Sample accepted risks and confirm the approver had the authority. Let a test exception expire and confirm the technical control blocks the activity again.
