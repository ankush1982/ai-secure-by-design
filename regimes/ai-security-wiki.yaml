    family: Supply Chain, Infrastructure and Resilience
    tier: Advanced
    description: "AI Infrastructure Hardening: Harden and segment the infrastructure that trains and serves models."
    implementation: Separate experimentation, training, evaluation and production. Isolate model runtimes at the network level and allow only required egress. Manage secrets centrally, and isolate tenants on shared GPUs. Set security requirements for the model APIs and other network services that AI systems call, including authentication, encryption in transit and the endpoints allowed, and monitor them.
