    name: Regulator and Authority Engagement
    family: Governance and Compliance
    tier: Advanced
    description: "Regulator and Authority Engagement: Know which authorities oversee each AI system, meet the registration, filing and notification duties they set, and keep a record of every contact."
    implementation: Keep a register of the authorities and ethics bodies relevant to each AI system and jurisdiction, with the duties each one sets and an owner for each duty. Track filings, registrations and local representative appointments to their due dates. Log every contact and its outcome. Watch for new guidance and pending rules, and review the register on a schedule. Keep contact with AI security interest groups and information-sharing communities, and record what is shared with them.
    severity: MEDIUM
    evidence: Authority register; filing and registration records; representative appointments; contact log; watchlist of pending rules.
    auditTest: Sample AI systems and confirm each lists its authorities and duties. Trace one filing or notification to its due date and evidence. Confirm the register was reviewed in the period.
