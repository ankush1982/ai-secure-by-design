  - id: AI-CTRL-019
    name: Knowledge Base Integrity
    family: Data and Retrieval
    tier: Advanced
    description: "Knowledge Base Integrity: Stop untrusted or poisoned content from entering the corpus that AI systems retrieve from."
    implementation: Control who and what can write to the corpus. Record the source of every indexed item. Scan ingested content for embedded instructions, and keep the ability to find and remove items by source. Record an owner and a freshness limit for each source, and monitor retrieval quality for drift so that superseded or degraded content is found and removed. Measure the corpus against data quality thresholds for currentness, credibility of source and duplication, so that stale or low-quality content is treated as a defect and not only tampering.
    severity: MEDIUM
    evidence: Ingestion access list; provenance records; ingestion scan results; removal test.
    auditTest: Add a document with a planted instruction and a false fact through each ingestion path. Confirm it is detected or neutralized, and that it can be traced and removed.
