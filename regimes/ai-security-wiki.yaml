  - id: AI-CTRL-026
    name: Agent Memory and Context Integrity
    family: Agents and Tools
    tier: Advanced
    description: "Agent Memory and Context Integrity: Prevent poisoned or cross-user content from persisting in agent memory and context."
    implementation: Separate memory by user and tenant. Record the source of each memory item, apply expiry, and provide a way to inspect and purge memory. Do not let untrusted content write to long-term memory unchecked. Keep an inventory of memory stores with a named owner for each. Write down what each assistant may and may not remember, and enforce it when memory is written. Let users see, correct and delete what is remembered about them, and include memory in data subject access and erasure requests.
    severity: MEDIUM
    evidence: Memory isolation tests; memory provenance records; purge procedure and test; memory store inventory with owners; memory write policy and enforcement results; access and erasure request records that cover memory.
