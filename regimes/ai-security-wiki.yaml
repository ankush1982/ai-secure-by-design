  - id: AI-CTRL-020
    name: Output Handling
    family: Application Runtime
    tier: Baseline
    description: "Output Handling: Treat model output as untrusted input to whatever consumes it."
    implementation: Validate and encode output before it is rendered, executed or passed to another system. Restrict what output can trigger, such as links, images and calls. Inspect responses for sensitive data. Treat reasoning traces, intermediate tool output and system instructions as sensitive content. Decide whether each is shown to users or written to logs, apply the same classification as the final output, and test for leakage.
