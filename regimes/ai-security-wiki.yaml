    family: Governance and Compliance
    tier: Advanced
    description: "AI Literacy and Role-Based Competence: Give everyone who builds, operates, oversees or uses AI the knowledge their role needs, and keep the records that show it."
    implementation: Define the knowledge each role group needs, from board members to human reviewers and contractors. Deliver role-based training on a schedule and when a role or a system changes. Record completion and results. Check that the training works, for example through scenario tests and reviewer override rates.
