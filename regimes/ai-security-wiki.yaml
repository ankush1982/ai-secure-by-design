  - id: AI-CTRL-012
    name: AI Policy, Roles and Acceptable Use
    family: Governance and Compliance
    tier: Baseline
    description: "AI Policy, Roles and Acceptable Use: Set and communicate the rules and responsibilities for using and building AI, and map each rule to a control."
    implementation: Publish an AI policy and acceptable-use standard with scope, owner and review date. Have the board, or the body that holds that authority, approve an AI strategy that states the organization's approach to AI and its AI risk appetite, and review it at least annually. Define roles and decision rights across the three lines, and record governance decisions. Map each policy statement to a control in this library. Train users and reinforce the rules at the point of use. Align the AI policy with the information security, privacy, data and other organizational policies it touches, and record where they overlap or conflict. Include AI acceptable use in terms of employment and contractor agreements, and handle breaches through the existing disciplinary process.
    severity: HIGH
    evidence: Approved policy; board-approved AI strategy and risk appetite with its review record; roles and responsibilities record; governance decision log; policy-to-control mapping; training and acknowledgement records; policy alignment record; employment and contractor terms covering AI use.
