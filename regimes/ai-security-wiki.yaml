  - id: AI-CTRL-025
    name: AI Containment and Kill Switch
    family: Agents and Tools
    tier: Baseline
    description: "AI Containment and Kill Switch: Stop an agent or suspend a high-risk AI model, revoke its access and limit the damage within minutes, with a tested fallback."
    implementation: Provide a tested way to stop a single agent and to revoke credentials for all agents. Set limits on steps, time and spend per task. Know which actions can be rolled back and how. For every AI use case rated high risk or material, including models that are not agents (for example credit, fraud or pricing models) and third-party AI, name who may suspend it, set the triggers (risk tolerance breached, incident, regulator request), route decisions to a fallback or manual process while it is off, require re-approval before restart, and test activation at least once a year. Where a vendor runs the model, secure the right to have it suspended in the contract. Keep the log of every action the AI system took through containment and rollback; nothing the stop or the reversal does may remove it. Where an agent can reach cleartext payment card data, shut it down automatically (fail secure) on unusual activity such as an attempt to reach a system outside its scope.
    severity: HIGH
    evidence: Kill switch procedure; register of kill switches for high-risk use cases with owners, triggers and fallbacks; test records with timings; task limits configuration.
    auditTest: Start a long-running test agent and stop it. Measure the time until no further actions occur and credentials are invalid. Sample high-risk use cases and confirm each has a kill switch, a fallback and a test within the last year; suspend one model in the lab and confirm decisions route to the fallback.
    owner: AI Platform Team / SOC
    reviewFrequency: Semi-annually
    url: https://nachi065.github.io/AI-Security-Wiki/03_Control_Library/03_AI_Security_Control_Objectives_Library.html#ai-ctrl-025
