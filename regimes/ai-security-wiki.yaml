  - id: AI-CTRL-024
    name: Tool and MCP Server Governance
    family: Agents and Tools
    tier: Baseline
    description: "Tool and MCP Server Governance: Allow agents to use only vetted tools and tool servers, and detect when they change."
    implementation: "Keep an allow-list of tools, plugins and MCP servers with an owner for each. Validate tool schemas, pin versions, and re-approve when a tool definition changes after approval. The same governance applies to agent skills and plugins: approve them from an allowlist after review, pin the version, check integrity on load and keep a procedure to remove one quickly. Treat tools that can override system or application controls, such as shells, database consoles and administration APIs, as privileged utilities: give them only to named agents that need them, and log every use."
