  - id: AI-CTRL-033
    name: AI Security Review and Release Gate
    family: Assurance and Testing
    tier: Baseline
    description: "AI Security Review and Release Gate: Review every AI system against its threats before production and after material change."
    implementation: "Threat model each system: assets, trust boundaries, worst-case output and maximum damage. Select controls from this library by risk tier. Record open risks and exceptions, and require sign-off before release. When an agent changes production systems, each change carries the same record as a person's change: reason, security impact, approval by an authorised person, test results and a rollback that was tested before approval. Set documented objectives for responsible development, such as security, privacy, reliability and fairness targets, and use them as release criteria."
    severity: HIGH
    evidence: Threat models; architecture review records; control selection; approvals and exceptions; responsible development objectives.
    auditTest: Sample production systems and confirm each has a current threat model, a control selection that matches its tier and a signed approval.
