  - id: AI-CTRL-046
    name: Intellectual Property and Copyright Governance
    family: Governance and Compliance
    tier: Advanced
    description: "Intellectual Property and Copyright Governance: Control the intellectual property and copyright exposure of AI inputs, outputs and training data."
    implementation: Set a policy on what third-party copyrighted or licensed material staff may submit to AI tools, and on how AI output may be used in products, code and publications. Review vendor terms for ownership of output, indemnity for infringement claims and use of inputs for training. Record the source and licence of training and fine-tuning data (AI-CTRL-029). Where policy requires, scan AI-generated code and content for licence and similarity matches before release. Record exceptions with an owner and an expiry date.
    severity: MEDIUM
    evidence: IP and acceptable-use policy; vendor terms review; training data provenance and licence records; scan results; exception log.
    auditTest: Sample vendors and confirm the terms were reviewed for output ownership and indemnity. Sample released AI-generated artefacts and confirm a scan result or a documented exception. Sample fine-tuning datasets and confirm source and licence are recorded.
    owner: Legal / Compliance
    reviewFrequency: Annually and when vendor terms change
    url: https://nachi065.github.io/AI-Security-Wiki/03_Control_Library/03_AI_Security_Control_Objectives_Library.html#ai-ctrl-046
    risks:
      - AI-R27
