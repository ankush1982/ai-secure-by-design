    implementation: "Record provenance for every dataset. Verify integrity before each training or fine-tuning run. Screen data for sensitive content and poisoning, and keep the ability to trace a model back to its data. Define a data quality profile for each dataset: choose the quality characteristics that matter for the task (for example completeness, accuracy, balance and representativeness, as named in ISO/IEC 5259-2), set a measured threshold for each, and have the data owner approve them. Check the thresholds before each run, and treat labelling quality as part of the profile when data is labelled."
