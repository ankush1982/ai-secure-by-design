    description: "AI Service Resilience and Fail-Safe Operation: Keep AI services and their security controls available, and make them fail safely."
    implementation: Decide for each control whether it fails open or closed, and test it. Measure the latency and quality cost of controls so that teams do not remove them. Provide failover that keeps guardrails, residency and logging intact. Keep tested fallback paths for AI-dependent processes, tested backups and an exit plan for each provider. Detect silent failure of controls.
