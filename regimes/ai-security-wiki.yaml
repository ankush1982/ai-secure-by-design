controls:
  - id: AI-CTRL-001
    name: AI Discovery
    family: Discovery and Workforce AI Use
    tier: Baseline
    description: "AI Discovery: Identify approved/unapproved AI platforms across browsers, endpoints, IDEs, SaaS, APIs and custom apps."
    implementation: Discover AI services, extensions, plugins, embedded SaaS AI features and API usage continuously. Classify each as approved, tolerated or unapproved, and attribute use to a user, device and application. Look for local models and agents and for AI add-ons such as browser extensions and IDE plug-ins on endpoints, use software allow-listing to stop unapproved installs, and watch network traffic for AI patterns such as Model Context Protocol (MCP) connections. Policy and training alone do not stop shadow AI.
    severity: HIGH
    evidence: AI service inventory; usage dashboard; user and device reports; classification of each service.
    auditTest: Seed a known set of approved and unapproved AI tools in a test group and compare the discovered inventory with ground truth. Confirm new tools appear within the stated interval.
    owner: Security Engineering
    reviewFrequency: Quarterly
