  - id: AI-CTRL-016
    name: Least Privilege and Scoped Credentials
    family: Identity and Access
    tier: Baseline
    description: "Least Privilege and Scoped Credentials: Limit what each AI workload and agent can reach to the minimum its task needs."
    implementation: "Use short-lived credentials scoped per tool and resource. Act with the end user's rights where a user is present, not with a broad service account. Detect and correct permission drift. Keep secrets out of locations an agent can read, such as environment variables, configuration files and shell history; issue short-lived tokens scoped to one task at the moment of the call; and plant canary credentials to detect an agent searching for credentials it was never given. Apply the same limits to training jobs, pipelines and model-serving identities: scope them to the datasets and models the task names, and revoke them when the job ends."
    severity: HIGH
    evidence: Permission maps; token scope configuration; access review records; drift reports.
    auditTest: Have a test agent attempt a tool or resource outside its scope and confirm it is denied and logged. Confirm credentials expire as configured.
    owner: IAM Team
    reviewFrequency: Quarterly
    url: https://nachi065.github.io/AI-Security-Wiki/03_Control_Library/03_AI_Security_Control_Objectives_Library.html#ai-ctrl-016
