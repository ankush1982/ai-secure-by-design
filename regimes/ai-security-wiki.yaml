  - id: AI-CTRL-034
    name: Adversarial Testing and Continuous Evaluation
    family: Assurance and Testing
    tier: Advanced
    description: "Adversarial Testing and Continuous Evaluation: Test AI systems against attacks before release and continuously afterwards."
    implementation: Red team each system against defined threat cases before release. Run a regression suite in the pipeline and whenever the model, prompt, tools or data change. The risk owner sets the acceptable attack success rate in writing. Re-run the regression suite whenever the model version, prompt, retrieval source or guardrail changes, including changes made by the provider, and set a tolerance for run-to-run output variation. Review each system's behaviour against its defined parameters at least quarterly, or at a frequency set by a documented risk analysis, and re-validate before go-live and after any change. Where an AI reviewer replaces manual code review, measure its detection rate on seeded flaws and re-measure when its model or configuration changes. Track AI threat intelligence, such as new MITRE ATLAS techniques, published incidents and provider advisories, and add relevant techniques to the threat cases and regression suite. Before testing a production system, agree the scope, timing and safeguards with its owner, and use test accounts and test data.
    severity: MEDIUM
    evidence: Red team reports; regression suite results; agreed thresholds; retest records; threat intelligence review log; production test authorisations.
    auditTest: Confirm the last model or prompt change triggered the regression suite. Reproduce a sample of reported findings and confirm fixes hold.
    owner: AI Red Team / AppSec
    reviewFrequency: Before each release and continuously
