# Secret-detection rules. Used by `sbd scan` (git hooks, agent hooks, MCP sbd_scan_text)
# and by `sbd check`. JavaScript regex syntax; put case-insensitivity in `flags`.
schemaVersion: "0.2"
rules:
  - id: SBD-SECRET-001
    title: AWS access key ID
    kind: secret
    severity: CRITICAL
    pattern: 'AKIA[0-9A-Z]{16}'
    regimes:
      - { regime: nist-ssdf-1.1, control: secret-scan-pre-commit }
      - { regime: iso-27001-2022, control: data-leakage-prevention }
    message: Hardcoded AWS access key ID.
    remediation: Move the credential to environment variables or a secret manager, and rotate the exposed key.

  - id: SBD-SECRET-002
    title: AWS secret access key assignment
    kind: secret
    severity: CRITICAL
    pattern: 'aws_secret_access_key\s*[:=]\s*["''][A-Za-z0-9/+=]{40}["'']'
    flags: i
    regimes:
      - { regime: nist-ssdf-1.1, control: secret-scan-pre-commit }
    message: Hardcoded AWS secret access key.
    remediation: Move the credential to a secret manager and rotate it.

  - id: SBD-SECRET-003
    title: Private key block
    kind: secret
    severity: CRITICAL
    pattern: '-----BEGIN (RSA |EC |OPENSSH |DSA |PGP |ENCRYPTED )?PRIVATE KEY( BLOCK)?-----'
    regimes:
      - { regime: nist-ssdf-1.1, control: secret-scan-pre-commit }
      - { regime: iso-27001-2022, control: cryptography }
    message: Private key material committed to source.
    remediation: Remove the key, store it in a secret manager or KMS, and rotate it.

  - id: SBD-SECRET-004
    title: Generic credential assignment
    kind: secret
    severity: HIGH
    pattern: '(api[_-]?key|secret|password|passwd|token)\s*[:=]\s*["''][A-Za-z0-9+/=_-]{24,}["'']'
    flags: i
    regimes:
      - { regime: nist-ssdf-1.1, control: secret-scan-pre-commit }
    message: Looks like a hardcoded credential.
    remediation: Read the value from an environment variable or secret manager.

  - id: SBD-SECRET-005
    title: OpenAI-style API key
    kind: secret
    severity: CRITICAL
    pattern: 'sk-(proj-|ant-)?[A-Za-z0-9_-]{32,}'
    regimes:
      - { regime: nist-ssdf-1.1, control: secret-scan-pre-commit }
    message: Hardcoded model-provider API key (sk-... format).
    remediation: Move the key to a secret manager and rotate it.

  - id: SBD-SECRET-006
    title: Slack token
    kind: secret
    severity: HIGH
    pattern: 'xox[baprs]-[A-Za-z0-9-]{10,}'
    regimes:
      - { regime: nist-ssdf-1.1, control: secret-scan-pre-commit }
    message: Hardcoded Slack token.
    remediation: Move the token to a secret manager and revoke it.

  - id: SBD-SECRET-007
    title: GitHub token
    kind: secret
    severity: CRITICAL
    pattern: '(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}'
    regimes:
      - { regime: nist-ssdf-1.1, control: secret-scan-pre-commit }
    message: Hardcoded GitHub token.
    remediation: Revoke the token and use a secret store or GitHub Actions secrets.

  - id: SBD-SECRET-008
    title: Google API key
    kind: secret
    severity: HIGH
    pattern: 'AIza[0-9A-Za-z_-]{35}'
    regimes:
      - { regime: nist-ssdf-1.1, control: secret-scan-pre-commit }
    message: Hardcoded Google API key.
    remediation: Restrict and rotate the key; load it from a secret manager.
