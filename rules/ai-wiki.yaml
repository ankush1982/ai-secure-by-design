schemaVersion: "0.2"
rules:
  - id: AIW-001
    title: Model output passed to code or shell execution
    kind: code
    severity: HIGH
    when:
      - regime:ai-security-wiki
    files:
      - .py
      - .js
      - .mjs
      - .cjs
      - .ts
      - .tsx
      - .jsx
    pattern: (\beval\s*\(|\bexec\s*\(|new\s+Function\s*\(|os\.system\s*\(|os\.popen\s*\(|subprocess\.\w+\([^)]*shell\s*=\s*True|child_process|\bexecSync\s*\(|\bspawnSync?\s*\()
    mustAlsoMatch:
      pattern: \b(completion|completions|llm_?out\w*|llm_?resp\w*|model_?out\w*|model_?resp\w*|ai_?out\w*|ai_?resp\w*|generated(_?code|_?sql|_?text)?|response\.(text|content|output_text)|message\.content|choices\[0\]|output_text|tool_?args|tool_?input)\b
      flags: i
    regimes:
      - regime: ai-security-wiki
        control: AI-CTRL-020
      - regime: ai-security-wiki
        control: AI-CTRL-022
      - regime: ai-security-wiki
        control: AI-CTRL-027
    message: Text from a model reaches eval, exec or a shell on this line.
    remediation: Never execute model output directly. Parse it into a fixed set of allowed actions, validate the arguments outside the model, and run any generated code in an isolated sandbox with no secrets and no network. Prove the fix with TC-L05-015, TC-L06-025.
  - id: AIW-002
    title: Model output rendered as raw HTML
    kind: code
    severity: MEDIUM
    when:
      - regime:ai-security-wiki
    files:
      - .py
      - .js
      - .mjs
      - .ts
      - .tsx
      - .jsx
      - .vue
      - .html
      - .jinja
      - .j2
      - .svelte
    pattern: (\.innerHTML\s*=|\.outerHTML\s*=|dangerouslySetInnerHTML|v-html\s*=|\{@html\s|\|\s*safe\b|\bMarkup\s*\(|mark_safe\s*\(|unsafe_allow_html\s*=\s*True)
    mustAlsoMatch:
      pattern: \b(completion|completions|llm_?out\w*|llm_?resp\w*|model_?out\w*|model_?resp\w*|ai_?out\w*|ai_?resp\w*|generated(_?code|_?sql|_?text)?|response\.(text|content|output_text)|message\.content|choices\[0\]|output_text|tool_?args|tool_?input)\b
      flags: i
    regimes:
      - regime: ai-security-wiki
        control: AI-CTRL-020
    message: Model output is inserted into a page without escaping, which allows script injection and link or image exfiltration.
    remediation: Escape model output by default. If you must render Markdown, sanitise the HTML with an allow-list and block remote images and links to unknown hosts. Prove the fix with TC-L05-014, TC-L05-020.
  - id: AIW-003
    title: Model output built into a SQL statement
    kind: code
    severity: HIGH
    when:
      - regime:ai-security-wiki
    files:
      - .py
      - .js
      - .mjs
      - .ts
      - .java
      - .cs
      - .go
      - .rb
      - .php
    pattern: (\.execute\w*\s*\(\s*(f["']|["'][^"']*["']\s*(\+|%)|["'][^"']*["']\.format)|\.(raw|query)\s*\(\s*`)
    mustAlsoMatch:
      pattern: \b(completion|completions|llm_?out\w*|llm_?resp\w*|model_?out\w*|model_?resp\w*|ai_?out\w*|ai_?resp\w*|generated(_?code|_?sql|_?text)?|response\.(text|content|output_text)|message\.content|choices\[0\]|output_text|tool_?args|tool_?input)\b
      flags: i
    regimes:
      - regime: ai-security-wiki
        control: AI-CTRL-020
      - regime: ai-security-wiki
        control: AI-CTRL-022
    message: A SQL statement is assembled from model output by string formatting.
    remediation: Use parameterised queries, and give the model a fixed set of query templates or a read-only role rather than free SQL. Prove the fix with TC-L05-015, TC-L06-014.
  - id: AIW-004
    title: Model or data file loaded with unsafe deserialisation
    kind: code
    severity: HIGH
    when:
      - regime:ai-security-wiki
    files:
      - .py
      - .ipynb
    pattern: (\bpickle\.loads?\s*\(|\bcloudpickle\.loads?\s*\(|\bdill\.loads?\s*\(|\bjoblib\.load\s*\(|\btorch\.load\s*\(|allow_pickle\s*=\s*True)
    unlessNearby:
      pattern: weights_only\s*=\s*True
      before: 0
      after: 0
    regimes:
      - regime: ai-security-wiki
        control: AI-CTRL-028
      - regime: ai-security-wiki
        control: AI-CTRL-031
    message: This load can run code embedded in the file. A model or dataset from outside your control can execute on load.
    remediation: Prefer safetensors or another format that cannot carry code. For torch.load pass weights_only=True explicitly (check the default for your PyTorch version). Scan third-party model files before loading and load them only from your own registry. Prove the fix with TC-L12-002, TC-L12-004, TC-L16-005.
  - id: AIW-005
    title: Remote model code trusted at load time
    kind: code
    severity: HIGH
    when:
      - regime:ai-security-wiki
    files:
      - .py
      - .ipynb
      - .yaml
      - .yml
      - .json
      - .toml
    pattern: trust_remote_code["']?\s*[=:]\s*(True|true)
    regimes:
      - regime: ai-security-wiki
        control: AI-CTRL-031
      - regime: ai-security-wiki
        control: AI-CTRL-027
    message: trust_remote_code runs Python shipped with the model repository on your machine.
    remediation: Avoid it. If a model needs it, review the code, pin the exact revision, and load it only in an isolated environment. Prove the fix with TC-L16-003, TC-L16-004.
  - id: AIW-006
    title: Model downloaded without a pinned revision
    kind: code
    severity: LOW
    when:
      - regime:ai-security-wiki
    files:
      - .py
      - .ipynb
    pattern: (\.from_pretrained\s*\(\s*["'][\w.\-]+/[\w.\-]+["']|\bhf_hub_download\s*\(|\bsnapshot_download\s*\()
    unlessNearby:
      pattern: \brevision\s*=
      before: 0
      after: 0
    regimes:
      - regime: ai-security-wiki
        control: AI-CTRL-031
    message: A hub model is fetched by name only, so a later push to that repository changes what you run.
    remediation: Pass revision= with a commit hash, and record the model, revision and hash in your AI-BOM. Prove the fix with TC-L12-018, TC-L16-001, TC-L16-003.
  - id: AIW-007
    title: MCP server launched from an unpinned package
    kind: mcp-config
    severity: MEDIUM
    when:
      - regime:ai-security-wiki
    regimes:
      - regime: ai-security-wiki
        control: AI-CTRL-024
      - regime: ai-security-wiki
        control: AI-CTRL-031
    message: The MCP server is started from a package with no fixed version, so a new release runs without review.
    remediation: Pin the exact version (or the image digest), review the server's tool definitions, and record the pin in your tool inventory. Prove the fix with TC-L06-006, TC-L06-008, TC-L06-037, TC-L16-015.
  - id: AIW-008
    title: Remote MCP server over plain HTTP
    kind: mcp-config
    severity: HIGH
    when:
      - regime:ai-security-wiki
    regimes:
      - regime: ai-security-wiki
        control: AI-CTRL-024
      - regime: ai-security-wiki
        control: AI-CTRL-015
    message: A remote MCP server is reached over http://, so tokens and tool results cross the network unencrypted.
    remediation: Use https:// for any server that is not on the loopback interface, and authenticate the connection. Prove the fix with TC-L06-010.
  - id: AIW-009
    title: MCP tools approved automatically
    kind: mcp-config
    severity: MEDIUM
    when:
      - regime:ai-security-wiki
    regimes:
      - regime: ai-security-wiki
        control: AI-CTRL-023
      - regime: ai-security-wiki
        control: AI-CTRL-024
    message: The client is told to run this server's tools without asking a person.
    remediation: Remove the auto-approval, or limit it to named read-only tools. Keep human approval for any tool that writes, sends or deletes. Prove the fix with TC-L06-015, TC-L06-016, TC-L06-011.
  - id: AIW-010
    title: Coding agent run with approvals or sandbox switched off
    kind: code
    severity: MEDIUM
    when:
      - regime:ai-security-wiki
    files:
      - .sh
      - .bash
      - .zsh
      - .ps1
      - .bat
      - .cmd
      - .yml
      - .yaml
      - .json
      - .toml
      - Dockerfile
      - Makefile
      - .py
      - .js
      - .ts
    pattern: (--dangerously-skip-permissions|--dangerously-bypass-approvals-and-sandbox|--yolo\b|--approval-mode[= ]+yolo|--full-auto\b|"autoApprove"\s*:\s*true|"chat\.tools\.autoApprove"\s*:\s*true)
    regimes:
      - regime: ai-security-wiki
        control: AI-CTRL-023
      - regime: ai-security-wiki
        control: AI-CTRL-027
      - regime: ai-security-wiki
        control: AI-CTRL-004
    message: A coding agent is started with its approval prompts or sandbox disabled.
    remediation: Run unattended agents only inside a disposable container with no production credentials and an egress allow-list, and keep the flag out of developer machines and shared scripts. Prove the fix with TC-L06-036, TC-L06-025.
