# privacy-security-manifest.yaml — single source of truth for what data this
# product handles, which regulatory regimes apply, and how the deployed
# scaffolds should behave.
#
# Generated by /sbd-init. Edit by hand or via /sbd-add. Re-run /sbd-check
# anytime to verify code is in sync.
#
# This file is the contract between:
#   - the user (you, declaring what's true about your product)
#   - the deployed scaffolds (which read this file at runtime)
#   - the AI assistant (which nudges based on declarations here)
#
# Reference: see docs/manifest-schema.md for the full schema.

schemaVersion: 0.1

product:
  name: doctor-ai-assistant
  description: |
    AI-assisted clinical decision support for general physicians. Suggests
    differential diagnoses based on symptoms and patient history. Advisory only —
    every suggestion requires physician review before any clinical action.
  region: IN                  # IN | EU | US | GLOBAL (drives DPDP §16 defaults)
  deploymentMode: saas        # saas | self-hosted | on-prem | air-gapped

regimes:
  - id: nist-ssdf-1.1
    scope: Secure SDLC baseline.

  - id: iso-27001-2022
    scope: Annex A controls relevant to dev/SDLC.

  - id: dpdp-2023
    scope: Patient and physician personal data under DPDP Act 2023.
    significantDataFiduciary: null   # null = undecided; true if you self-assess § 10 applies; consult counsel.

dataCategories:
  - name: patient-clinical
    sensitivity: sensitive-personal
    rationale: Clinical data — diagnoses, prescriptions, lab results, vitals.
    fields:
      - diagnosis
      - prescription
      - lab_result
      - vital_signs
      - symptom_notes
    storedIn:
      - patients
      - encounters
      - lab_results
      - prescriptions
    retentionDays: 1825                # 5 years — typical for medical records (verify with state Clinical Establishment Act)
    consentRequired: true
    consentBasis: explicit             # DPDP §6 — explicit consent for sensitive
    childrenDataPossible: true         # paediatric patients possible → DPDP §9
    crossBorderRestrictions:
      - Do not transfer outside India without explicit re-consent.

  - name: patient-identity
    sensitivity: personal
    rationale: Demographics needed to disambiguate patients.
    fields:
      - name
      - dob
      - phone
      - email
      - address
    storedIn:
      - patients
    retentionDays: 1825
    consentRequired: true
    consentBasis: explicit
    childrenDataPossible: true

  - name: physician-identity
    sensitivity: personal
    rationale: Practitioner records for service delivery.
    fields:
      - name
      - email
      - phone
      - medical_license_no
      - state_council
    storedIn:
      - practitioners
    retentionDays: 2555                # 7 years (account closure + statutory)
    consentRequired: true
    consentBasis: contract             # DPDP §7 — legitimate use for service provision
    childrenDataPossible: false

aiSystems:
  - name: clinical-suggestion-engine
    purpose: Suggest differential diagnoses to physicians.
    sdk: openai
    riskLevel: high                    # affects clinical care
    decisionAutonomy: advisory         # human-in-the-loop required
    humanOversight: physician-review-mandatory
    logDecisions: true                 # → routes through src/ai/decision_log.ts
    explainability: model-card         # disclose to users
    inputCategories: [patient-clinical, patient-identity]
    outputType: diagnosis-suggestion

dataSubjectRights:
  contactPath: /api/dpdp/dsr           # base path for DSR endpoints (deployed by dsr-handler scaffold)
  rightsImplemented:
    - access                           # DPDP §11
    - correction                       # DPDP §12
    - erasure                          # DPDP §12
    - grievance                        # DPDP §13
    - nomination                       # DPDP §14
  responseDays: 30                     # internal SLA (Act sets no fixed number; final rules will)
  grievanceOfficer:
    name: TODO(user)
    email: TODO(user)
    phone: TODO(user)

breachNotification:
  internalEscalation: security@example.com         # TODO(user): replace
  dpbContactEmail: TODO(user)                      # endpoint for DPB notification
  dataSubjectNotifyChannel: email
  responseTargetHours: 72

crossBorder:
  destinations: []                     # list services hosted outside India; declare each
  # Example entry once added:
  # - service: openai
  #   country: US
  #   region: us-east-1
  #   purpose: AI inference for diagnostic suggestion
  #   legalBasis: explicit consent (DPDP §6)
  #   reviewed: 2026-06-11

securityControls:
  encryptionAtRest: required
  encryptionInTransit: required
  rbac: required
  auditLog: required
  secretManager: aws-secrets-manager   # vault | aws-secrets-manager | gcp-sm | doppler
  parentConsentProvider: null          # TODO(user): set if children-gate is deployed

# Metadata
manifest:
  generatedBy: secure-by-design v0.1.0
  generatedAt: TODO(generator)
  lastEditedAt: TODO(generator)
