# Generated by secure-by-design v0.1.0.
# CI workflow that mirrors local /sbd-check on every PR + push.
# Tune triggers and node/python versions to your project.

name: secure-by-design

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  manifest-check:
    name: Verify privacy-security-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm manifest exists
        run: |
          if [ ! -f privacy-security-manifest.yaml ]; then
            echo "::error::privacy-security-manifest.yaml missing — run /sbd-init."
            exit 1
          fi

      - name: Validate manifest schema
        run: |
          pip install pyyaml jsonschema
          python - <<'PY'
          import yaml, sys
          with open('privacy-security-manifest.yaml') as f:
              m = yaml.safe_load(f)
          assert m.get('schemaVersion'), 'schemaVersion missing'
          assert m.get('regimes'), 'regimes missing'
          assert m.get('dataCategories'), 'dataCategories missing'
          print('manifest ok:', m['product']['name'], '-', [r['id'] for r in m['regimes']])
          PY

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG_LICENSE_NOTICE: 'plugin runs gitleaks free tier'

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    if: hashFiles('package.json') != '' || hashFiles('requirements.txt') != ''
    steps:
      - uses: actions/checkout@v4
      - name: npm audit (if package.json)
        if: hashFiles('package.json') != ''
        run: |
          if [ -f pnpm-lock.yaml ]; then
            npx pnpm audit --audit-level=high || true
          elif [ -f yarn.lock ]; then
            npx yarn audit --level high || true
          else
            npm audit --audit-level=high || true
          fi
      - name: pip-audit (if requirements.txt)
        if: hashFiles('requirements.txt') != ''
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true

  regime-review:
    name: Regime review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Run sbd-check (skeleton)
        run: |
          # TODO(user): once the MCP server is installed, swap this for:
          #   npx @ankush/secure-by-design check --diff $(git merge-base origin/${{ github.base_ref }} HEAD)..HEAD
          echo "::notice::sbd-check skeleton — wire up the MCP CLI here."
