# Generated by secure-by-design v0.2.0.
# Runs the same sbd engine as the git hooks and the MCP server, so CI enforces the
# checks whichever AI (or human) wrote the code. Tune triggers to your project.

name: secure-by-design

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  sbd-check:
    name: sbd check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # SARIF upload to code scanning
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Pin this to a release tag or full commit SHA before relying on it (supply-chain hygiene).
      - uses: ankush1982/ai-secure-by-design@main
        with:
          fail-on: high
          # On pull requests, only report lines the PR adds:
          diff: ${{ github.event_name == 'pull_request' && format('origin/{0}...HEAD', github.base_ref) || '' }}

  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # gitleaks-action needs a GITLEAKS_LICENSE secret for organisation-owned repos (check its README).
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    if: hashFiles('package.json') != '' || hashFiles('requirements.txt') != ''
    steps:
      - uses: actions/checkout@v4
      - name: npm audit (if package.json)
        if: hashFiles('package.json') != ''
        run: |
          if [ -f pnpm-lock.yaml ]; then
            npx pnpm audit --audit-level=high
          elif [ -f yarn.lock ]; then
            npx yarn audit --level high
          else
            npm audit --audit-level=high
          fi
      - name: pip-audit (if requirements.txt)
        if: hashFiles('requirements.txt') != ''
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
